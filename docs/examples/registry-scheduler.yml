name: Dispatch the official plugin registry

on:
  schedule:
    - cron: '7-57/10 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: registry-scheduler
    strategy:
      fail-fast: false
      matrix:
        workflow: [registry-reconcile.yml, registry-publish.yml]
    steps:
      - name: Require the private scheduler's protected default branch
        env:
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          [[ "$REPOSITORY_PRIVATE" == true && "$GITHUB_REF_PROTECTED" == true && "$GITHUB_REF" == "refs/heads/$DEFAULT_BRANCH" ]]
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        id: dispatcher
        with:
          owner: certimate-go
          repositories: plugins
          client-id: ${{ vars.REGISTRY_SCHEDULER_APP_CLIENT_ID }}
          private-key: ${{ secrets.REGISTRY_SCHEDULER_APP_PRIVATE_KEY }}
          permission-actions: write
      - name: Dispatch and record the central workflow run
        env:
          GH_TOKEN: ${{ steps.dispatcher.outputs.token }}
          WORKFLOW: ${{ matrix.workflow }}
        run: |
          response="$(gh api --method POST -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/certimate-go/plugins/actions/workflows/$WORKFLOW/dispatches" -f ref=main)"
          run_url="$(jq -er '.html_url | select(test("^https://github\\.com/certimate-go/plugins/actions/runs/[0-9]+$"))' <<<"$response")"
          printf 'Dispatched %s on main: %s\n' "$WORKFLOW" "$run_url"
          printf -- '- [%s](%s)\n' "$WORKFLOW" "$run_url" >>"$GITHUB_STEP_SUMMARY"
