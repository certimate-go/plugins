name: Publish signed plugin market

on:
  push:
    branches: [main]
    paths: ['registry/**']
  workflow_dispatch:
  schedule:
    - cron: '3,33 * * * *'

permissions:
  contents: write

concurrency:
  group: registry-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'certimate-go/plugins' && github.ref == 'refs/heads/main' && github.ref_protected
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: registry-publish
    env:
      GOWORK: 'off'
      GOTOOLCHAIN: local
      GIT_TERMINAL_PROMPT: '0'
      PUBLIC_KEYS: ${{ vars.REGISTRY_INDEX_PUBLIC_KEYS_JSON }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
          cache: false
      - name: Build registry tools
        run: go build -mod=readonly -o "$RUNNER_TEMP/registryctl" ./cmd/registryctl
      - name: Generate and sign the catalog
        id: stage
        env:
          INDEX_KEY_ID: ${{ vars.REGISTRY_INDEX_KEY_ID }}
          INDEX_EPOCH: ${{ vars.REGISTRY_INDEX_EPOCH }}
          INDEX_LIFETIME: ${{ vars.REGISTRY_INDEX_LIFETIME }}
          INDEX_RENEW_BEFORE: ${{ vars.REGISTRY_INDEX_RENEW_BEFORE }}
          INDEX_SEED: ${{ secrets.REGISTRY_INDEX_SEED }}
        run: bash .github/scripts/registry-publish.sh stage
      - name: Push the generated catalog to main
        if: steps.stage.outputs.changed == 'true'
        env:
          MARKET_COMMIT: ${{ steps.stage.outputs.market_commit }}
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/registry-publish.sh push
      - name: Confirm the catalog on the CDN
        env:
          MARKET_COMMIT: ${{ steps.stage.outputs.market_commit }}
        run: bash .github/scripts/registry-publish.sh observe
