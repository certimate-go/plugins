name: Register provider releases

on:
  workflow_dispatch:
  schedule:
    - cron: '7-57/10 * * * *'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: registry-reconcile
  cancel-in-progress: false

jobs:
  register:
    if: github.repository == 'certimate-go/plugins' && github.ref == 'refs/heads/main' && github.ref_protected
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
          cache: false
      - name: Open pull requests for new formal tags
        env:
          GH_TOKEN: ${{ github.token }}
          GOWORK: 'off'
          GOTOOLCHAIN: local
          GIT_TERMINAL_PROMPT: '0'
        run: bash .github/scripts/registry-reconcile.sh scan
