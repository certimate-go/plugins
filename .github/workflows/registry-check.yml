name: Check automatic registration

on:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
    inputs:
      candidate_ref:
        description: Server-created pull merge ref or merge queue branch
        required: true
        type: string

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: registry-check-${{ inputs.candidate_ref || github.event.merge_group.head_ref }}
  cancel-in-progress: false

jobs:
  relay:
    if: github.event_name == 'merge_group' && github.repository == 'certimate-go/plugins' && github.event.merge_group.base_ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Dispatch a protected check for the merge group
        env:
          CANDIDATE_REF: ${{ github.event.merge_group.head_ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$CANDIDATE_REF" =~ ^refs/heads/gh-readonly-queue/main/pr-[1-9][0-9]*-[0-9a-f]{7,40}$ ]]
          gh workflow run registry-check.yml --repo "$GITHUB_REPOSITORY" --ref main -f "candidate_ref=$CANDIDATE_REF"

  verify:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: registry-evidence
    outputs:
      sha: ${{ steps.verify.outputs.sha }}
    steps:
      - name: Require the registry protected branch
        run: |
          [[ "$GITHUB_REPOSITORY" == certimate-go/plugins && "$GITHUB_REF" == refs/heads/main && "$GITHUB_REF_PROTECTED" == true ]]
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
          cache: false
      - name: Resolve admitted repositories for read-only evidence
        id: providers
        run: |
          jq -er '.[] | if test("^certimate-go/plugin-provider-[a-z0-9][a-z0-9_.-]*$") then ltrimstr("certimate-go/") else error("Invalid admitted repository") end' \
            registry/_policy/admissions.json > "$RUNNER_TEMP/evidence-providers"
          printf 'names=%s\n' "$(paste -sd, "$RUNNER_TEMP/evidence-providers")" >>"$GITHUB_OUTPUT"
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        id: evidence
        with:
          owner: certimate-go
          repositories: ${{ steps.providers.outputs.names }}
          client-id: ${{ vars.REGISTRY_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.REGISTRY_RELEASE_APP_PRIVATE_KEY }}
          permission-actions: read
          permission-contents: read
      - name: Verify the GitHub candidate without checking it out
        id: verify
        env:
          CANDIDATE_REF: ${{ inputs.candidate_ref }}
          GH_TOKEN: ${{ github.token }}
          PUBLIC_KEYS: ${{ vars.REGISTRY_INDEX_PUBLIC_KEYS_JSON }}
          EVIDENCE_TOKEN: ${{ steps.evidence.outputs.token }}
          GOWORK: "off"
          GOTOOLCHAIN: local
        run: bash .github/scripts/registry-check.sh

  report:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: verify
    environment: registry-check
    permissions:
      checks: write
      actions: write
    steps:
      - name: Report a check for the verified SHA only
        env:
          SHA: ${{ needs.verify.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]
          jq -cn --arg sha "$SHA" --arg details "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{name:"plugin-registration",head_sha:$sha,status:"completed",conclusion:"success",details_url:$details}' |
            gh api --method POST "repos/$GITHUB_REPOSITORY/check-runs" --input - --jq .html_url
      - name: Reconcile the verified pull request
        if: startsWith(inputs.candidate_ref, 'refs/pull/')
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run registry-reconcile.yml --repo "$GITHUB_REPOSITORY" --ref main
